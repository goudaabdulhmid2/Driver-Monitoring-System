version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dms_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build: ./backend
    container_name: dms_backend
    ports:
      - "8080:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/driver_monitoring
      - PORT=5000
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongodb
    restart: always

  frontend:
    build: ./frontend
    container_name: dms_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
