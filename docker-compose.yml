version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dms_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build: ./backend
    container_name: dms_backend
    ports:
      - "8080:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/driver_monitoring
      - PORT=5000
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongodb
    restart: always

  frontend:
    build: ./frontend
    container_name: dms_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: always

  yolo:
    build: ./yolo
    container_name: dms_yolo
    ports:
      - "5001:5001"
    devices:
      - "/dev/video0:/dev/video0"
    privileged: true
    environment:
      - API_URL=http://backend:5000/api/events
      - SHOW_VIDEO=False
      - FLASK_PORT=5001
      - DRIVER_ID=CHANGEME
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
